name: Jomado
options:
  bundleIdPrefix: com.ajay
  deploymentTarget:
    iOS: "26.0"
packages:
  JomadoCore:
    path: JomadoCore
targets:
  Jomado:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: JomadoApp
      - path: Resources
    info:
      path: Config/Info.plist
    entitlements:
      path: Config/Jomado.entitlements
    dependencies:
      - package: JomadoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajaydas.jomado
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Jomado:
    build:
      targets:
        Jomado: all
    run:
      config: Debug
