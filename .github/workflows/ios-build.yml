name: Build Jomado IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test core package
        run: swift test --package-path JomadoCore

      - name: Validate content and privacy resources
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("Resources/Content/hydration.json")
          items = json.loads(path.read_text(encoding="utf-8"))
          assert items, "hydration.json is empty"
          ids = [item["id"] for item in items]
          assert len(ids) == len(set(ids)), "hydration.json has duplicate IDs"
          for item in items:
              assert item["message"]["title"].strip(), f"blank title: {item['id']}"
              assert item["message"]["body"].strip(), f"blank body: {item['id']}"
              assert item["stage"] in item["context"]["urgencies"], f"stage mismatch: {item['id']}"
          print(f"Validated {len(items)} hydration messages")
          PY
          plutil -lint Config/Info.plist Resources/PrivacyInfo.xcprivacy

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Jomado
        run: |
          xcodebuild \
            -project Jomado.xcodeproj \
            -scheme Jomado \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Verify built app resources
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Jomado.app"
          test -d "$APP_PATH"
          test -n "$(find "$APP_PATH" -name hydration.json -print -quit)"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/Jomado.app \
            Payload/

          zip -r Jomado-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jomado-iOS
          path: Jomado-unsigned.ipa
